[project]
name = "patent-assistant"
version = "0.9.0"
description = "Lokaler KI-Assistent für Entwürfe deutscher Patentanmeldungen (Ollama + Streamlit)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.40",
    "ollama>=0.5",
    "python-docx>=1.1",
    "pypdf>=5.0",
]

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patent_assistant"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]   # long German prompt texts are intentional

[tool.pytest.ini_options]
testpaths = ["tests"]

[browser]
gatherUsageStats = false
